name: Nexa ERP Phase1 Final Clean

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Unzip Project
        run: |
          rm -rf nexa
          mkdir nexa
          unzip -o "NexaERP-SourceCode-v3.0-2026-08-05.zip" -d nexa

      # 🔥 DELETE UNUSED FILES (EXACT TARGET)
      - name: 🧹 Remove Unused Files
        run: |
          BASE="nexa/NexaERP-SourceCode"

          # ❌ remove docs
          rm -f $BASE/README.md

          # ❌ remove advanced modules
          rm -f $BASE/frontend/pages/modules/ClientDirectory.tsx
          rm -f $BASE/frontend/pages/modules/SalesPipeline.tsx
          rm -f $BASE/frontend/pages/modules/StaffManagement.tsx
          rm -f $BASE/frontend/pages/modules/CategoryModule.tsx

          # ❌ remove AI / extra UI
          rm -f $BASE/frontend/components/erp/AIDrawer.tsx
          rm -f $BASE/frontend/components/erp/ScannerModal.tsx
          rm -f $BASE/frontend/components/erp/GlobalSearch.tsx
          rm -f $BASE/frontend/components/erp/EditProfileModal.tsx

      # 🔥 KEEP ONLY CORE MODULES CONFIRM
      - name: 📌 Keep Core Modules
        run: |
          echo "Keeping:"
          echo "LoginRegister.tsx"
          echo "Dashboard.tsx"
          echo "POSBilling.tsx"
          echo "Inventory.tsx"
          echo "UdhaarBook.tsx"
          echo "ExpenseTracker.tsx"

      # 💡 ADD PHASE FLAG
      - name: ✏️ Add Phase Config
        run: |
          echo "export const PHASE = 'phase1';" > nexa/NexaERP-SourceCode/frontend/phaseConfig.js

      # 📂 MOVE CLEAN PROJECT
      - name: 📂 Finalize
        run: |
          rm -rf working-project
          mv nexa/NexaERP-SourceCode working-project

      # 💾 COMMIT
      - name: 💾 Commit Final
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Phase1 Nexa ERP Clean (only core modules)"
          git push
